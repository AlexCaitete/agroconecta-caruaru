spring.application.name=agroconecta-caruaru
server.port=8080

spring.datasource.url=jdbc:sqlite:agroconecta.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html

spring.config.import=optional:file:./segredos.properties
agroconecta.jwt.segredo=${JWT_SEGREDO:}
agroconecta.jwt.expiracao-minutos=120